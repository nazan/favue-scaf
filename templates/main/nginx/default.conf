# Gateway: HTTP (:80) for browsers / upstream-terminated TLS.
# Nginx $variables: doubled ($$) so the scaffolder's Python Template leaves a single $ for nginx.

map $$http_upgrade $$connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ${BACKEND_NAME}_upstream {
    server ${BACKEND_NAME}:8000;
}

upstream ${FRONTEND_NAME}_upstream {
    server ${FRONTEND_NAME}:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    include /etc/nginx/includes/locations.conf;
}
