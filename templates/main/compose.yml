# Local development stack. Production may use a separate compose overlay.
services:
  gateway:
    image: nginx:1.25-alpine
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      - ${BACKEND_NAME}
      - ${FRONTEND_NAME}

  ${BACKEND_NAME}:
    build:
      context: ./${BACKEND_NAME}
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    init: true
    volumes:
      - ./${BACKEND_NAME}:/home/appuser/app
      - sitepack:/home/appuser/venv
    env_file: ./${BACKEND_NAME}/.env
    environment:
      - INTERNAL_CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      ${BACKEND_NAME}-database:
        condition: service_healthy
      ${BACKEND_NAME}-database-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    command: /bin/sh -c "mkdir -p logs && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ${BACKEND_NAME}-worker:
    build:
      context: ./${BACKEND_NAME}
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    tty: true
    init: true
    volumes:
      - ./${BACKEND_NAME}:/home/appuser/app
      - sitepack:/home/appuser/venv
    env_file: ./${BACKEND_NAME}/.env
    depends_on:
      ${BACKEND_NAME}-database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/sh -c "mkdir -p logs && exec taskiq worker app.taskiq_worker:broker --workers 1"

  ${BACKEND_NAME}-cron:
    image: alpine:3.19
    depends_on:
      ${BACKEND_NAME}:
        condition: service_started
    init: true
    environment:
      - INTERNAL_CORE_URL=http://${BACKEND_NAME}:8000
      - CRON_SECRET=${CRON_SECRET:-}
      - CRON_TZ=${CRON_TZ:-UTC}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata
        trap "exit 0" TERM INT
        while true; do
          curl -s -X POST -H "X-Cron-Secret: $${CRON_SECRET}" "$${INTERNAL_CORE_URL:-http://${BACKEND_NAME}:8000}/api/internal/scheduler-beacon" || true
          sleep 5 & wait $!
        done

  ${FRONTEND_NAME}:
    build:
      context: ./${FRONTEND_NAME}
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    init: true
    volumes:
      - ./${FRONTEND_NAME}:/home/node/app
    environment:
      - VITE_API_BASE_URL=${CORE_URL:-http://localhost}
      - VITE_HMR_CLIENT_PORT=${GATEWAY_PORT:-80}
    ports:
      - "${WEB_PORT}:5173"
    depends_on:
      - ${BACKEND_NAME}
      - ${BACKEND_NAME}-cron

  ${BACKEND_NAME}-database:
    image: mysql:8.0
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    environment:
      - "MYSQL_DATABASE=${DB_NAME}"
      - "MYSQL_USER=user"
      - "MYSQL_PASSWORD=password"
      - "MYSQL_ROOT_PASSWORD=password"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 2s

  ${BACKEND_NAME}-database-test:
    image: mysql:8.0
    volumes:
      - dbdata-test:/var/lib/mysql
    ports:
      - "${DB_TEST_PORT}:3306"
    environment:
      - "MYSQL_DATABASE=${DB_NAME}"
      - "MYSQL_USER=user"
      - "MYSQL_PASSWORD=password"
      - "MYSQL_ROOT_PASSWORD=password"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
    external: true
    name: ${PROJECT_NAME}_redis_data
  dbdata:
    external: true
    name: ${PROJECT_NAME}_dbdata
  dbdata-test:
    external: true
    name: ${PROJECT_NAME}_dbdata_test
  sitepack:
    external: true
    name: ${PROJECT_NAME}_sitepack
